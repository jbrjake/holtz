# ── Recon ──

[[transitions]]
from = "idle"
to = "recon"
command = "run_start"
gates = []

[[transitions]]
from = "recon"
to = "audit"
command = "recon_complete"
gates = [
    { type = "query", sql = "SELECT count(DISTINCT step) >= 5 FROM events WHERE type='recon_step'", expect = "true", intent = "recon must cover all 5 steps" },
    { type = "file_exists", path = "docs/holtz/impact-graph.json", intent = "impact graph must exist before auditing" },
    { type = "ledger_has_event", event = "recon_step", min_count = 5, intent = "each recon step must be recorded" },
    { type = "ledger_has_event", event = "justine_dispatched", min_count = 1, intent = "Justine must be dispatched for parallel audit" },
    { type = "ledger_has_event", event = "snapshot", min_count = 1, intent = "pre-audit edge count snapshot needed for comparison" },
    { type = "ledger_lacks_event", event = "finding", filter = { phase = "audit" }, intent = "no audit-phase findings should exist before recon is complete" },
    { type = "ledger_has_event", event = "quiz_bank_generated", min_count = 1, intent = "lens quiz bank must be generated from the graph during recon (#73) — the vault key is writable only in recon, so it cannot be built later" },
]

# ── Audit ──

[[transitions]]
from = "audit"
to = "merge_ready"
command = "audit_complete"
gates = [
    { type = "ledger_has_event", event = "audit_claim", min_count = 1, intent = "at least one doc claim must be verified" },
    { type = "snapshot_compare", cmd = "python3 $CLAUDE_PLUGIN_ROOT/skills/holtz/scripts/impact_graph.py --graph docs/holtz/impact-graph.json stats", extract = "edges", compare = "gt", reference = "snapshot:pre_audit_edge_count", intent = "audit must add edges to the impact graph" },
]

# ── Merge ──

[[transitions]]
from = "merge_ready"
to = "merge_done"
command = "merge_complete"
gates = [
    # The merge writes Justine's unmatched findings onto the ledger, so the
    # unified worklist is the already-rendered PUNCHLIST.md and there is no
    # merged file to check for. What is left to prove is that the merge ran to
    # completion, and MERGE-REPORT.md is the one artifact only a completed
    # merge can produce — blind-spot analysis has no other source. It is
    # agent-authored and unmanaged, so this gate is satisfiable by its writer
    # (the #60 wedge was a file_exists on a path nothing was allowed to write).
    { type = "command_succeeds", cmd = 'python3 "${CLAUDE_PLUGIN_ROOT:?must be set to the holtz plugin directory}/enforcement/scripts/validate_merge_report.py" docs/holtz/MERGE-REPORT.md', intent = "merge report must exist with all four sections non-empty" },
    { type = "ledger_has_event", event = "merge_agent_dispatched", min_count = 1, intent = "merge must be performed by a separate merge-agent subagent" },
]

# ── Fix Loop ──

# fix_loop_start lands in awaiting_clear, NOT fix_loop: the punchlist is now
# built (merge complete / audit pass done), and the agent MUST /clear before
# touching any fix. The `resume` transition below carries awaiting_clear ->
# fix_loop, gated on a `context_reset` that Claude Code's SessionStart hook
# vouched for — so a real context reset is enforced between building the
# worklist and the first fix, by the same machinery that gates the
# per-iteration clears inside the loop.
[[transitions]]
from = "merge_done"
to = "awaiting_clear"
command = "fix_loop_start"
gates = [
    { type = "ledger_has_event", event = "reference_read", filter = { path = "step-10-fix-loop.md" }, min_count = 1, intent = "must read fix loop procedure before starting" },
    # P0.4 deleted PUNCHLIST-MERGED.md as a concept: the merge writes findings
    # onto the ledger and PUNCHLIST.md is the rendered worklist. A leftover
    # copy is not a stale file, it is a second worklist — one written once,
    # re-rendered by nothing, and still marking every finding OPEN. A run read
    # it exclusively for four pattern rounds, blind to 176 findings and 25
    # committed fixes, and 111 subagent-minutes went to reconciling the
    # bookkeeping against reality afterwards. The fix loop must not start while
    # it is on disk.
    #
    # Inverted from the shape that wedged issue #60, deliberately. That gate
    # required this same file to *exist* while the PreToolUse guard forbade
    # writing it, so the only satisfying act was blocked and the run stopped
    # for good. This one is satisfied by deleting the file, and the file is
    # absent from MANAGED_DOCS precisely so that delete is allowed — the
    # escape is achievable by construction, not by permission.
    { type = "not", intent = "delete docs/holtz/PUNCHLIST-MERGED.md — the ledger is the merged worklist and PUNCHLIST.md renders it", gates = [
        { type = "file_exists", path = "docs/holtz/PUNCHLIST-MERGED.md" },
    ] },
]

# Lens rotations (no merge on subsequent passes) also clear before fixing:
# audit -> awaiting_clear -> (resume) -> fix_loop.
[[transitions]]
from = "audit"
to = "awaiting_clear"
command = "fix_loop_start"
gates = [
    { type = "ledger_has_event", event = "state_transition", filter = { to = "merge_done" }, min_count = 1, intent = "first pass must go through merge before fix loop" },
    { type = "ledger_has_event", event = "reference_read", filter = { path = "step-10-fix-loop.md" }, min_count = 1, intent = "must read fix loop procedure before starting" },
]

# The four suite gates in this file no longer *run* the suite — they ask
# whether it was already run and passed on this exact working tree.
#
# The fix loop used to execute the target's full suite three times per finding
# (fix subagent, orchestrator re-validation, and this gate), of which only this
# one was enforced, and the last two ran on a byte-identical tree because
# `git commit` does not touch working-tree contents. `verify_suite.py` splits
# "run the suite" from "know the suite passed": `--record` runs it and writes a
# `suite_green` naming a hash of the tree, `--check` recomputes that hash and
# asks the ledger. So the run happens where the work happens (taught in
# references/phase-fix-loop.md) and every gate downstream is a predicate.
#
# `--check` is safe inside a transition: it reads via `sahjhan query`, which
# opens the ledger file directly and never touches the daemon socket — so a
# gate cannot re-enter the daemon that is evaluating it.
#
# `--scope affected` here and `full` everywhere else is the whole cost model.
# An affected run covers the tests the impact graph says reach what changed
# since the last *full* green; because that graph is agent-written, an affected
# green is a cost optimisation and not an independent integrity claim. What
# bounds it is `iteration_boundary` below, which accepts `full` and nothing
# else — so the narrowed window can never span more than one iteration. Weaken
# that gate and the affected scope here stops meaning anything.
#
# `evidence` is not a sahjhan gate param — the engine flattens unknown keys
# into `params` and ignores them. It is here so the event this gate really
# depends on is *named* rather than buried in the script's SQL: H10 fails the
# build if the named event is not what the invoked tool queries, H1 fails it if
# nothing can write that event, and docs/ENFORCEMENT-CONTRACT.md renders the
# writer and forgeability instead of calling this a direct check.
#
# The suite command itself (and why it is `-x --ff` and never `--lf`) now lives
# in exactly one place: `DEFAULT_PYTEST` in verify_suite.py. `$HOLTZ_PYTEST`
# still overrides it; it is read there rather than expanded here.
[[transitions]]
from = "fix_loop"
to = "fix_loop"
command = "fix_commit"
args = ["item_id"]
gates = [
    { type = "command_succeeds", cmd = "git log -1 --format=%B | grep -q '{{item_id}}'", intent = "commit must reference the punchlist item" },
    { type = "command_succeeds", cmd = 'python3 "${CLAUDE_PLUGIN_ROOT:?must be set to the holtz plugin directory}/enforcement/scripts/verify_suite.py" --check --scope affected', timeout = 60, evidence = "suite_green", intent = "test suite must pass after fix" },
    { type = "ledger_has_event_since", event = "blast_radius", since = "last_transition", intent = "blast radius must be checked after each fix" },
    { type = "ledger_has_event_since", event = "hardening_complete", since = "last_transition", intent = "edge cases must be hardened after each fix" },
    { type = "query", sql = "SELECT count(*) < 15 FROM events WHERE type='state_transition' AND command='fix_commit' AND seq > COALESCE((SELECT MAX(seq) FROM events WHERE type='state_transition' AND command='iteration_boundary'), 0)", expect = "true", intent = "circuit breaker: max 15 fixes per iteration (scoped since the last iteration_boundary /clear, so the cap resets each context reset instead of capping the whole run)" },
]
# fix_commit AUTO-EMITS finding_resolved (sahjhan >= 0.18.0). Recording the
# transition writes a state_transition; the finding's resolution is a separate
# finding_resolved event, and STATUS/PUNCHLIST "Resolved" counts plus every
# downstream gate (pattern_check, set complete perspective, converge) read
# finding_resolved — NOT the transition. Emitting it here keeps "committed a fix
# for BH-NNN" and "BH-NNN is resolved" atomic in the single `transition
# fix_commit BH-NNN` command, so the agent never restates the same fact. Without
# this an audit could run the full TDD loop, commit N fixes, and still show
# "Resolved: 0" with all findings open, unable to converge. id comes from the
# positional item_id arg; commit_hash from the just-made HEAD; project/run/
# auditor are inherited from the run's prior events; phase/step are literals.
emits = [
    { event = "finding_resolved", commands = { commit_hash = "git rev-parse --short=7 HEAD" }, fields = { id = "{{item_id}}", commit_hash = "{{commit_hash}}", project = "{{project}}", run = "{{run}}", auditor = "{{auditor}}", phase = "fix_loop", step = "10" } },
]

# ── Merge: this finding is a duplicate of that one ──
#
# P0.2's round cap (D7) needs an escape, and its clause names one: "close **or
# merge** at least as many as it opens". Closing needs a fix; merging is what
# a sibling search actually produces when the sibling turns out to be a
# finding the board already carries. Until now the run had no way to say that
# — finding-level merge existed only in the one-time Step 9 Holtz/Justine
# phase — so the cap would have been a block naming a command that does not
# exist.
#
# Declared from `fix_loop` **and** from `pattern_analysis`, because the two
# D7 gates sit in different states and each block must name something
# reachable from its own side. This is the same reason `defer_low`/
# `defer_medium` gained their `pattern_analysis` edges for D2.
#
# A merge emits `finding_resolved`, so it closes the item everywhere at once
# and the obligation stays one count rather than two. `commit_hash` is stamped
# from HEAD exactly as `fix_commit` stamps it: it names the tree the merge was
# decided against, and leaving the field optional instead would weaken the
# schema for the fix path, which is the path that actually needs it.

[[transitions]]
from = "fix_loop"
to = "fix_loop"
command = "merge_finding"
args = ["item_id", "merged_into"]
gates = [
    { type = "query", query = "item_open", expect = "true" },
    { type = "query", query = "merge_target_exists", expect = "true" },
]
emits = [
    { event = "finding_resolved", commands = { commit_hash = "git rev-parse --short=7 HEAD" }, fields = { id = "{{item_id}}", merged_into = "{{merged_into}}", commit_hash = "{{commit_hash}}", project = "{{project}}", run = "{{run}}", auditor = "{{auditor}}", phase = "fix_loop", step = "10" } },
]

# The same edge from inside a round. `step` is 11 rather than 10 for the same
# reason the deferral pair uses it — that is where a round runs.
[[transitions]]
from = "pattern_analysis"
to = "pattern_analysis"
command = "merge_finding"
args = ["item_id", "merged_into"]
gates = [
    { type = "query", query = "item_open", expect = "true" },
    { type = "query", query = "merge_target_exists", expect = "true" },
]
emits = [
    { event = "finding_resolved", commands = { commit_hash = "git rev-parse --short=7 HEAD" }, fields = { id = "{{item_id}}", merged_into = "{{merged_into}}", commit_hash = "{{commit_hash}}", project = "{{project}}", run = "{{run}}", auditor = "{{auditor}}", phase = "fix_loop", step = "11" } },
]

# ── Deferral: can't reproduce ──

[[transitions]]
from = "fix_loop"
to = "fix_loop"
command = "defer_cant_reproduce"
args = ["item_id"]
gates = [
    { type = "query", sql = "SELECT count(*) >= 1 FROM events WHERE type='finding' AND id='{{item_id}}'", expect = "true", intent = "finding must exist" },
    { type = "query", query = "item_open", expect = "true" },
    { type = "ledger_has_event_since", event = "fix_start", since = "last_transition", intent = "must have started working on this item" },
    { type = "command_succeeds", cmd = "test -f docs/holtz/investigations/{{item_id}}.md && test -s docs/holtz/investigations/{{item_id}}.md", intent = "reproduction attempts must be documented in investigation file" },
]
# Like fix_commit, the deferral transitions AUTO-EMIT the state they imply
# (#82). The gate above requires the item to be open; recording the transition
# without recording the deferral left it open, so the agent had to state the
# same fact a second time — `defer cant-reproduce BH-001` followed by `event
# finding_deferred --field id=BH-001 …`. Two commands per deferred finding, on
# a run that defers many, for a fact the engine already had from the arg. Worse
# than the token cost: run them in the other order and the `item_open` gate
# refuses the transition that was meant to record it, and forget the second and
# convergence blocks on a finding that reads open while its transition says
# otherwise. The gate evaluates before the emit, so this cannot satisfy itself.
emits = [
    { event = "finding_deferred", fields = { id = "{{item_id}}", reason = "cant_reproduce", evidence_path = "docs/holtz/investigations/{{item_id}}.md", project = "{{project}}", run = "{{run}}", auditor = "{{auditor}}", phase = "fix_loop", step = "10" } },
]

# ── Deferral: LOW severity ──

[[transitions]]
from = "fix_loop"
to = "fix_loop"
command = "defer_low"
args = ["item_id"]
gates = [
    { type = "query", query = "item_is_low", expect = "true" },
    { type = "query", query = "item_open", expect = "true" },
]
# Auto-emits the deferral; see defer_cant_reproduce above (#82).
emits = [
    { event = "finding_deferred", fields = { id = "{{item_id}}", reason = "low_priority", project = "{{project}}", run = "{{run}}", auditor = "{{auditor}}", phase = "fix_loop", step = "10" } },
]

# ── Deferral: MEDIUM severity (budget-capped) ──

[[transitions]]
from = "fix_loop"
to = "fix_loop"
command = "defer_medium"
args = ["item_id"]
gates = [
    { type = "query", query = "item_is_medium", expect = "true" },
    { type = "query", query = "item_open", expect = "true" },
    { type = "query", query = "medium_deferral_budget", expect = "true" },
]
# Auto-emits the deferral; see defer_cant_reproduce above (#82). `reason` is
# load-bearing here rather than decorative: the budget gate counts exactly
# `reason='medium_budget'`, so the emit is what keeps the cap countable. It is
# evaluated before this emit, so a deferral cannot fund its own budget.
emits = [
    { event = "finding_deferred", fields = { id = "{{item_id}}", reason = "medium_budget", project = "{{project}}", run = "{{run}}", auditor = "{{auditor}}", phase = "fix_loop", step = "10" } },
]

# ── Context Reset (enforces /clear boundaries) ──

[[transitions]]
from = "fix_loop"
to = "awaiting_clear"
command = "iteration_boundary"
gates = [
    # BH-020: Enforce pattern analysis after 3+ fixes to prevent recurring
    # band-aid fixes. The auditor cannot skip Step 11 and escape to /clear.
    #
    # #82: this counted `state_transition WHERE command='fix_commit'` while the
    # escape it names — `pattern_check` — counted `finding_resolved`. Two
    # expressions of one fact, so they could disagree: a finding resolved
    # without a fix_commit (the standalone path SKILL.md teaches) advanced one
    # count and not the other, and a fix_commit whose `emits` failed advanced
    # the other and not this one. In that second case this gate blocked while
    # `pattern_check` was not yet ready — the block and its own printed escape,
    # both shut. That is #77's deadlock, reachable from a different direction.
    # Now both reference the same named query with opposite expectations, so
    # exactly one of them is open at any moment, always.
    { type = "query", query = "pattern_analysis_overdue", expect = "false", intent = "pattern analysis required after 3+ fixes — run pattern_check before iteration_boundary" },
    # The re-basing gate, and the reason `fix_commit` may narrow at all.
    #
    # Each affected run measures its diff from the last *full* green, so
    # without a full run somewhere the window only widens — and the impact
    # graph that decides "affected" is written by the agent, so a bogus `tests`
    # edge could narrow one fix_commit. Neither survives here: this accepts
    # `full` and nothing else, and it fires at every /clear boundary (every 3-5
    # fixes), so the untested gap is bounded by one iteration. Cheap for the
    # same reason: one full run per boundary, not one per fix.
    { type = "command_succeeds", cmd = 'python3 "${CLAUDE_PLUGIN_ROOT:?must be set to the holtz plugin directory}/enforcement/scripts/verify_suite.py" --check --scope full', timeout = 60, evidence = "suite_green", intent = "the full suite must pass on this tree before a context reset — this is what re-bases the affected scope" },
    # P0.2's round cap and its obligation (D7), at the boundary every fix
    # batch passes. The cap is checked here as well as on `pattern_done`
    # because Step 11's *usual* path never enters `pattern_analysis` at all —
    # it stays in `fix_loop` and cashes the round in here, so a cap that only
    # gated `pattern_done` would cap the rare path and leave the common one
    # uncapped. One named query, two consumers, so they cannot drift.
    #
    # The obligation is here and nowhere else: `fix_commit` and
    # `merge_finding` are both reachable from `fix_loop`, so the block always
    # names a command the run can run.
    { type = "query", query = "round_item_cap_exceeded", expect = "false", intent = "the last round left more than 3 findings open — fix them, or merge a duplicate into the finding it repeats with `sahjhan transition merge_finding BH-NNN BH-MMM`" },
    { type = "query", query = "round_opens_exceed_closes", expect = "false", intent = "the last round opened more findings than the run has closed since — resolve one with `fix_commit`, or merge a duplicate with `sahjhan transition merge_finding BH-NNN BH-MMM`" },
]

# The filter is what makes this gate mean what it says. `context_reset` used to
# be recorded by the primer on every UserPromptSubmit — including automated
# background-task notifications — so the gate opened on whatever prompt arrived
# next, with the pre-reset context fully intact (#79). Only session_start.py can
# write `trigger=session_start`, and only when Claude Code reports a SessionStart
# whose source actually wiped the context. Requiring the provenance here means
# the block condition and the evidence are the same fact.
[[transitions]]
from = "awaiting_clear"
to = "fix_loop"
command = "resume"
boundary = "context-reset"
gates = [
    { type = "ledger_has_event_since", event = "context_reset", since = "last_transition", filter = { trigger = "session_start" }, intent = "context must be reset via /clear (or compaction) before resuming" },
]

# The third layer, and the one that fails at rest rather than at runtime (#82).
# `context_reset` is declared `attestation = "host"`; requiring host here means
# that if anyone ever re-points the event at a weaker signal — as #79 did, to
# UserPromptSubmit, which is `ambient` — `sahjhan lint` L7 fails the build
# instead of the gate silently opening on the next prompt that arrives.
  [transitions.integrity]
  requires_attestation = "host"

# ── Pause for human (#69) ──
# Reversible pause so the agent can yield the turn to answer a user question
# mid-fix-loop without abandoning the run. No gates: pausing to talk to the
# human is always legitimate. The Stop hook allows stopping in awaiting_human
# (it is in STOP_ALLOWED_STATES but NOT DAEMON_CLEANUP_STATES), so the daemon
# and session key survive and `resume` picks the run back up.

[[transitions]]
from = "fix_loop"
to = "awaiting_human"
command = "pause"

[[transitions]]
from = "awaiting_human"
to = "fix_loop"
command = "resume"

# ── Pattern Analysis ──

[[transitions]]
from = "fix_loop"
to = "pattern_analysis"
command = "pattern_check"
gates = [
    # #65: use a COALESCE-scoped query rather than ledger_has_event_since. The
    # old gate referenced `last_event_of_type:...`, a syntax that gate type does
    # not understand: it matched no event, silently fell back to "since last
    # state_transition", and ignored min_count entirely — so the first
    # pattern_check could never fire (chicken-and-egg: you need a prior
    # pattern_analysis_complete to satisfy the gate that produces the first one).
    # COALESCE(..., 0) treats "no prior pattern analysis" as the run start, so
    # the first pattern_check becomes ready once 3+ findings are resolved.
    #
    # #82: the predicate itself now lives in protocol.toml [queries], shared
    # with iteration_boundary's block and the commit gate's. See that comment.
    # Blocked either because fewer than 3 findings have been resolved since the
    # last round, or because the last two rounds added no pattern and the
    # obligation has lapsed. The second case has no escape to print and needs
    # none: a round is still available without this transition — Step 11's
    # usual path stays in `fix_loop` and records with `pattern_round.py`.
    { type = "query", query = "pattern_analysis_overdue", expect = "true", intent = "pattern analysis needs 3+ findings resolved since the last one, and is no longer owed once two consecutive rounds added no pattern — run Step 11 in fix_loop instead" },
]

[[transitions]]
from = "pattern_analysis"
to = "fix_loop"
command = "pattern_done"
gates = [
    { type = "ledger_has_event_since", event = "pattern_analysis_complete", since = "last_transition", intent = "pattern analysis must be recorded before returning to fixes" },
    # P0.1's amplification circuit-breaker. The block lands here rather than on
    # `fix_commit`: this edge is the *return* to fix_loop, so a tripped breaker
    # stops the next fix being dispatched instead of firing between a verified
    # fix and its own commit.
    #
    # `any_of` is what makes the escape one object with the block. The first
    # branch is the breaker untripped; the second is the post-state a single
    # `sahjhan defer batch --severity low,medium` produces.
    #
    # The second branch says "budget spent", not "no open MEDIUM", and that is
    # load-bearing rather than a weakening: `defer_medium` caps deferrals at
    # 50% of the MEDIUMs, so no command can empty that set, and a block whose
    # escape cannot clear it is #77's deadlock. Spending a budget cannot be
    # refused. `medium_deferral_budget` is reused with the opposite expectation
    # rather than restated, so the cap and this cannot disagree.
    { type = "any_of", intent = "amplification: more findings filed than resolved for 3 consecutive rounds — run `sahjhan defer batch --severity low,medium` to clear every open LOW and spend the MEDIUM budget", gates = [
        { type = "query", query = "amplification_diverging", expect = "false" },
        { type = "all_of", gates = [
            { type = "query", query = "open_low_count", expect = "0" },
            { type = "query", query = "medium_deferral_budget", expect = "false" },
        ] },
    ] },
    # P0.2's round cap (D7). The escape is `merge_finding`, which is declared
    # from this state for that reason; `fix_commit` is not reachable here.
    { type = "query", query = "round_item_cap_exceeded", expect = "false", intent = "this round left more than 3 findings open — merge a duplicate into the finding it repeats with `sahjhan transition merge_finding BH-NNN BH-MMM`" },
]

# ── Deferral from a pattern round ──
#
# The same two deferrals, reachable from `pattern_analysis`. Without these the
# breaker above is a dead end by construction: `pattern_analysis` has exactly
# one exit, and `defer_low`/`defer_medium` are declared `fix_loop → fix_loop`,
# so a run stopped at `pattern_done` cannot run the command that block names.
# `sahjhan defer batch` does not merely refuse each item there — it exits
# non-zero on the first one and defers nothing at all.
#
# Gates and emits are identical to the `fix_loop` pair on purpose, including
# `medium_deferral_budget`: the 50% cap must not become weaker inside a pattern
# round than outside one. `step` is 11 rather than 10 because that is where a
# round runs, matching `ROUND_STEP` in `pattern_round.py`.

[[transitions]]
from = "pattern_analysis"
to = "pattern_analysis"
command = "defer_low"
args = ["item_id"]
gates = [
    { type = "query", query = "item_is_low", expect = "true" },
    { type = "query", query = "item_open", expect = "true" },
]
emits = [
    { event = "finding_deferred", fields = { id = "{{item_id}}", reason = "low_priority", project = "{{project}}", run = "{{run}}", auditor = "{{auditor}}", phase = "fix_loop", step = "11" } },
]

[[transitions]]
from = "pattern_analysis"
to = "pattern_analysis"
command = "defer_medium"
args = ["item_id"]
gates = [
    { type = "query", query = "item_is_medium", expect = "true" },
    { type = "query", query = "item_open", expect = "true" },
    { type = "query", query = "medium_deferral_budget", expect = "true" },
]
emits = [
    { event = "finding_deferred", fields = { id = "{{item_id}}", reason = "medium_budget", project = "{{project}}", run = "{{run}}", auditor = "{{auditor}}", phase = "fix_loop", step = "11" } },
]

# ── Perspective (Lens) Completion ──

[[transitions]]
from = "fix_loop"
to = "perspective_clean"
command = "set complete perspective"
args = ["current_perspective"]
gates = [
    { type = "query", query = "all_findings_closed", expect = "0" },
    # The other end of the fix batch. `iteration_boundary` holds the /clear and
    # this holds the lens, so the pattern round is owed wherever a batch of
    # fixes ends and at neither point inside one. Without this a run that
    # closed a whole perspective without a context reset left the loop having
    # skipped every round — the commit-path block used to cover that by
    # accident, at the cost of firing between a verified fix and its own commit.
    # Same named query as `pattern_check`'s gate with the opposite expectation,
    # so the escape this prints is ready exactly when this blocks (#82).
    { type = "query", query = "pattern_analysis_overdue", expect = "false", intent = "pattern analysis required after 3+ fixes — run pattern_check before completing the perspective" },
    { type = "query", sql = "SELECT count(*) >= 2 FROM events WHERE type='iteration_complete' AND perspective='{{current_perspective}}'", expect = "true", intent = "two clean iterations required for stability" },
    { type = "min_elapsed", event = "iteration_complete", seconds = 120, intent = "prevent rapid-fire gaming of iteration count" },
    { type = "command_succeeds", cmd = 'python3 "${CLAUDE_PLUGIN_ROOT:?must be set to the holtz plugin directory}/enforcement/scripts/verify_suite.py" --check --scope full', timeout = 60, evidence = "suite_green", intent = "tests must pass" },
    { type = "command_succeeds", cmd = "${HOLTZ_LINT:-ruff check .}", timeout = 30, intent = "no lint violations" },
    { type = "no_violations", intent = "no unresolved protocol violations" },
    { type = "query", sql = "SELECT count(*) >= 1 FROM events WHERE type='quiz_answered' AND pass='true' AND perspective='{{current_perspective}}'", expect = "true", intent = "lens quiz must be passed" },
    { type = "query", sql = "SELECT count(*) >= 1 FROM events WHERE type='quiz_posed' AND perspective='{{current_perspective}}'", expect = "true", intent = "quiz must be posed by enforcement hook before completion" },
    { type = "ledger_has_event_since", event = "lens_sweep_started", filter = { perspective = "{{current_perspective}}" }, since = "last_event_of_type:set_member_complete", intent = "a lens sweep must be started for this perspective before completion" },
]

[[transitions]]
from = "perspective_clean"
to = "audit"
command = "lens_rotate"
args = ["completed_perspective"]
gates = [
    { type = "query", sql = "SELECT count(*) >= 1 FROM events WHERE type='set_member_complete' AND member='{{completed_perspective}}'", expect = "true", intent = "perspective must be marked complete before rotating" },
]

# ── Convergence ──

[[transitions]]
from = "perspective_clean"
to = "all_perspectives_clean"
command = "all_perspectives"
gates = [
    { type = "set_covered", set = "perspective", event = "set_member_complete", field = "member", intent = "all 13 lenses must pass clean" },
]

[[transitions]]
from = "all_perspectives_clean"
to = "final_sweep"
command = "final_sweep_start"
gates = []

[[transitions]]
from = "final_sweep"
to = "final_sweep_clean"
command = "converge"
gates = [
    { type = "set_covered", set = "perspective", event = "set_member_complete", field = "member", intent = "all lenses must be complete" },
    { type = "command_succeeds", cmd = 'python3 "${CLAUDE_PLUGIN_ROOT:?must be set to the holtz plugin directory}/enforcement/scripts/verify_suite.py" --check --scope full', timeout = 60, evidence = "suite_green", intent = "tests must pass" },
    { type = "command_succeeds", cmd = "${HOLTZ_LINT:-ruff check .}", timeout = 30, intent = "no lint violations" },
    # P0.1's convergence redefinition (D4), replacing `all_findings_closed`.
    # The audited run's open count rose 124 -> 273 and fell exactly once, so
    # "every finding closed" was unreachable and the run could not terminate;
    # what it could not do either was say which findings actually had to be
    # closed. These four conjuncts say it. MEDIUM and LOW may now legitimately
    # remain open at convergence — which is precisely why the amplification
    # conjunct has to be here, and why it reads as pointless against the gate
    # it replaces rather than the one it joins.
    #
    # D5 keeps the 50% cap load-bearing: the MEDIUM budget must be spent, so
    # the carve-out above cannot become a way of deferring MEDIUMs instead of
    # fixing half of them. Same query as `pattern_done`'s escape, same
    # spelling for "spent".
    #
    # Every one of these is escapable by `sweep_dirty`, the ungated
    # `final_sweep -> fix_loop` edge: a blocked converge goes back and works.
    { type = "query", query = "all_critical_resolved", expect = "true", intent = "every CRITICAL finding must be resolved — run `sweep_dirty` and fix them" },
    { type = "query", query = "all_user_reachable_high_closed", expect = "true", intent = "every user-reachable HIGH must be resolved or deferred — run `sweep_dirty` and work them" },
    { type = "query", query = "amplification_diverging", expect = "false", intent = "the run is still filing faster than it retires over the last 3 rounds" },
    { type = "file_exists", path = "docs/holtz/DEFERRED.md", intent = "docs/holtz/DEFERRED.md must exist" },
    { type = "query", query = "medium_deferral_budget", expect = "false", intent = "the MEDIUM deferral budget must be spent — half the MEDIUMs get fixed, not deferred" },
    { type = "no_violations", intent = "no unresolved protocol violations" },
    { type = "query", query = "quiz_exhaustions_resolved", expect = "true" },
]

[[transitions]]
from = "final_sweep"
to = "fix_loop"
command = "sweep_dirty"
# No gates — if the sweep found issues, go back to fix loop

[[transitions]]
from = "final_sweep_clean"
to = "converged"
command = "confirm_convergence"
gates = []

[[transitions]]
from = "converged"
to = "finalized"
command = "finalize"
gates = [
    { type = "ledger_has_event", event = "baseline_updated", intent = "architecture baseline must be updated" },
    { type = "ledger_has_event", event = "living_punchlist_updated", intent = "living punchlist must be updated" },
    { type = "ledger_has_event", event = "pattern_contribution_complete", intent = "pattern contribution must be completed or skipped" },
]
