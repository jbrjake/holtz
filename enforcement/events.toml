# A pattern round closed, and this is what it produced (P5.4).
#
# `patterns_found` was a number the agent typed, and on the one run it has been
# measured against it was wrong in the rounds that would have mattered: 14 and
# 15 recorded 5 and 2 while `patterns-brief.md` says in its own words that both
# added none. It is derived now — `pattern_ids` are the `## PAT-NNN:` entries
# this run has in the brief (and its archive) that no earlier round in this
# ledger reported, and `patterns_found` is how many. Claiming a pattern means
# writing one into the artifact the round exists to produce.
#
# `restricted` + hash-pinned writer is what makes that hold, and the writer is
# a PostToolUse hook rather than the script the agent runs: that script
# executes in the sandboxed shell and cannot reach the daemon. `siblings_found`
# crosses from the run's own output — how many siblings a round filed is a fact
# only the round has — and no gate reads it.
#
# `phase` and `step` are stamped by the courier from constants in
# `pattern_round.py`: a round is Step 11 of the fix loop wherever it runs, and
# the suite pins those constants against the document that teaches it. They are
# what lets a reader of the ledger alone place the event in the protocol, which
# is why every other event carries them.
[events.pattern_analysis_complete]
description = "Pattern analysis cycle completed"
attestation = "tool"
restricted = true
fields = [
    { name = "project", type = "string" },
    { name = "run", type = "string", pattern = "^\\d+$" },
    { name = "auditor", type = "string", pattern = "^(holtz|justine)$" },
    { name = "phase", type = "string", pattern = "^(recon|audit|merge|fix_loop|convergence|finalize)$" },
    { name = "step", type = "string", pattern = "^\\d+$" },
    { name = "patterns_found", type = "string", pattern = "^\\d+$" },
    # Optional because most rounds add nothing, and an empty list has no
    # spelling this pattern admits.
    { name = "pattern_ids", type = "string", pattern = "^PAT-\\d+(,PAT-\\d+)*$", optional = true },
    { name = "siblings_found", type = "string", pattern = "^\\d+$" },
]

[[events.pattern_analysis_complete.producers]]
id = "hook:enforcement/hooks/pattern_courier.py"

# A stale sweep closed, and what it covered (P0.2, D8).
#
# Past ~round 8 this is what discharges the owed round instead of a pattern
# analysis — the swap the plan's ~220–470 agent-min saving rests on. The sweep
# is the best-performing mechanism the audited run had: 68 open HIGHs triaged
# in 14 agent-min, ~3.5 min per retirement against 23.4 for a round, writing no
# code. It retires board; a round adds to it.
#
# Nothing recorded a sweep before this. Step 11b writes `fix_start` and a
# `cant_reproduce` deferral only for the findings it *retires*, so a sweep
# where everything still reproduces left no trace, and that deferral is
# reachable outside a sweep anyway. An obligation cannot be discharged by a
# fact the ledger does not hold.
#
# What makes the claim cost something is coverage, which is why `triaged` is
# derived rather than typed: D21 settled the population as every open finding
# at every severity, and `stale_sweep.py` refuses unless the verdicts name
# exactly it. `restricted` + a hash-pinned PostToolUse writer is what keeps
# that hold — the script runs in the sandboxed shell and cannot reach the
# daemon, and a weaker sibling event would simply become the cheaper door past
# round 8, undoing what P5.4 bought for the round it replaces.
[events.stale_sweep_complete]
description = "A stale sweep triaged the whole open board"
attestation = "tool"
restricted = true
fields = [
    { name = "project", type = "string" },
    { name = "run", type = "string", pattern = "^\\d+$" },
    { name = "auditor", type = "string", pattern = "^(holtz|justine)$" },
    { name = "phase", type = "string", pattern = "^(recon|audit|merge|fix_loop|convergence|finalize)$" },
    { name = "step", type = "string", pattern = "^\\d+$" },
    { name = "triaged", type = "string", pattern = "^\\d+$" },
    { name = "retired", type = "string", pattern = "^\\d+$" },
]

[[events.stale_sweep_complete.producers]]
id = "hook:enforcement/hooks/stale_sweep_courier.py"

