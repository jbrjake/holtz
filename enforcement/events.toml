[events.finding]
description = "A punchlist finding"
attestation = "agent"
fields = [
    { name = "project", type = "string" },
    { name = "run", type = "string", pattern = "^\\d+$" },
    { name = "auditor", type = "string", pattern = "^(holtz|justine)$" },
    { name = "phase", type = "string", pattern = "^(recon|audit|merge|fix_loop|convergence|finalize)$" },
    { name = "step", type = "string", pattern = "^\\d+$" },
    { name = "id", type = "string", pattern = "^B[HJ]-\\d{3}$" },
    { name = "severity", type = "string", pattern = "^(CRITICAL|HIGH|MEDIUM|LOW)$" },
    { name = "category", type = "string" },
    { name = "location", type = "string" },
    { name = "perspective", type = "string" },
    { name = "description", type = "string" },
    { name = "predicted_by", type = "string" },
    # Which pattern a sibling was filed under (P0.2's backpressure conjunct).
    # `predicted_by` cannot carry this: across every archived run it holds a
    # prediction index (0-7) and never a PAT id, and the two facts answer
    # different questions. Optional because only Step 11.2's sibling search
    # attributes a finding to a pattern; audit and lens findings have none.
    #
    # `pattern_analysis_overdue` counts these only when the id appears in some
    # round's `pattern_ids`, which the courier derives from the brief's own
    # headings — so a PAT the brief never got cannot inflate the population.
    { name = "pattern_id", type = "string", pattern = "^PAT-\\d+$", optional = true },
    # How the defect is reached (P0.5). ~22 of the audited run's 62 commits
    # were fault-injection-only — reachable only by making some other call
    # raise — and BH-258 conceded in its own text that "reachability on CPython
    # 3.12 is uncertain… needs a reachability probe before any fix" and got a
    # full fix cycle anyway. Meanwhile 51 of the 75 open HIGHs predated the
    # first commit and were never worked, including an HTML-injection bug.
    #
    # Required, not optional: a grading nobody has to state is a grading the
    # board will not carry, and this is the field D4's convergence conjunct
    # ("all user_reachable HIGH resolved-or-deferred") is defined over. An
    # optional field would make that conjunct silently weaker on every finding
    # that omitted it.
    { name = "reachability", type = "string", pattern = "^(user_reachable|fault_injected|theoretical)$" },
]

[[events.finding.producers]]
id = "agent:cli"

# P4.1's merge script: Justine keeps no ledger, so every finding of hers that
# Holtz did not also find reaches the board through here. Attestation is
# unchanged — the script runs `sahjhan event finding` in the agent's own shell,
# so these are agent-attested like any other filing, and the trust posture the
# generated contract reports does not move.
[[events.finding.producers]]
id = "tool:enforcement/scripts/merge_punchlists.py"

[events.finding_resolved]
description = "A finding was resolved"
attestation = "agent"
fields = [
    { name = "project", type = "string" },
    { name = "run", type = "string", pattern = "^\\d+$" },
    { name = "auditor", type = "string", pattern = "^(holtz|justine)$" },
    { name = "phase", type = "string", pattern = "^(recon|audit|merge|fix_loop|convergence|finalize)$" },
    { name = "step", type = "string", pattern = "^\\d+$" },
    { name = "id", type = "string", pattern = "^B[HJ]-\\d{3}$" },
    { name = "commit_hash", type = "string", pattern = "^[0-9a-f]{7,40}$" },
    { name = "evidence_path", type = "string", optional = true },
    # Set only by `merge_finding` (P0.2, D7): this id was a duplicate of
    # `merged_into`, so the work is tracked there and this one is closed.
    # A merge is a close — `all_findings_closed`, the punchlist counts and the
    # amplification measure all read it as one, which is what makes the
    # obligation "close **or merge** at least as many as it opens" one count
    # rather than two. `merged_into IS NOT NULL` is the only thing that tells
    # the two apart, and nothing needs to yet.
    { name = "merged_into", type = "string", pattern = "^B[HJ]-\\d{3}$", optional = true },
]

[[events.finding_resolved.producers]]
id = "agent:cli"

[[events.finding_resolved.producers]]
id = "engine:emits:fix_commit"

[[events.finding_resolved.producers]]
id = "engine:emits:merge_finding"

# P0.5's second route (D29/D34/D35): one hardening commit closes a whole
# module's fault-injected findings. It has to be a hook and not an `emits`
# because a transition writes exactly one event with a fixed field map, and a
# batch's size is not something the config knows. Attestation stays `agent` —
# the courier re-derives the batch from the ledger and stamps HEAD, but this is
# the same event an ordinary fix writes, and giving it a second, stronger trust
# level would mean two definitions of closed.
[[events.finding_resolved.producers]]
id = "hook:enforcement/hooks/hardening_batch_courier.py"

