# The escape from an exhausted lens quiz, and the one event in this file whose
# write path is a person rather than a process (#81).
#
# A lens quiz exists so that "I looked again" means the agent re-read the code:
# the questions are graph-derived during recon and locked when the vault key
# closes at recon_complete, so after the /clear they can only be answered from
# the source. A lens becomes *exhausted* when its subagent fails the quiz
# MAX_QUIZ_ATTEMPTS times, or when fix commits move the anchored source until
# the locked questions no longer describe it. Either way `converge` refuses
# while that lens is unresolved.
#
# So this event says "someone looked at a failed re-read and accepted it
# anyway" — which is exactly the judgement the agent must not make about
# itself. It used to have no writer at all: two places in lens_quiz.py told
# the agent to "record quiz_exhausted_resolved" and named no command, while
# the event was unrestricted, so the agent could clear its own failure the
# moment it guessed the syntax.
#
# `restricted = true` is the wrong tool here — that admits trusted hooks, and
# no hook can attest a human decision. Instead the bootstrap hook denies
# `sahjhan event quiz_exhausted_resolved` on the agent's Bash path, leaving
# the user's own `! sahjhan …` as the only way in.
[events.quiz_exhausted_resolved]
description = "A human reviewed an exhausted lens quiz and accepted it — recorded by the user with `! sahjhan event`, never by the agent"
attestation = "human"
fields = [
    { name = "project", type = "string" },
    { name = "run", type = "string", pattern = "^\\d+$" },
    { name = "auditor", type = "string", pattern = "^(holtz|justine)$" },
    { name = "perspective", type = "string" },
    { name = "resolution", type = "string", pattern = "^human_reviewed$" },
]

[[events.quiz_exhausted_resolved.producers]]
id = "human:skills/holtz/references/phase-convergence.md"

