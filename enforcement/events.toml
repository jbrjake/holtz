# The suite ran, on a *named* tree, and passed (#83 P4).
#
# The fix loop ran the target's full suite three times per finding and enforced
# one of them; two of the three executed on a byte-identical tree. `tree_hash`
# is what makes the redundancy removable: it pins the result to the exact
# working-tree contents that produced it, so a later gate can ask "was this
# tree proven green?" instead of proving it again. A tree that changed by one
# byte has a different hash and no longer satisfies anything.
#
# `restricted` + hash-pinned writer is what makes the answer trustworthy, and
# the writer is a PostToolUse hook rather than the script that runs the tests.
# That script executes in the agent's shell, which is sandboxed and cannot
# reach the daemon; the hook runs outside the sandbox. It computes `tree_hash`
# and `commit_hash` from git itself and reads `scope` from the command text the
# host reports, so every field a gate consults is derived beyond the agent's
# reach. `command` and `test_count` cross from the run's own output and no gate
# reads either. The strongest thing an agent can do is run the suite for real.
[events.suite_green]
description = "The test suite ran and passed on a specific working-tree hash"
attestation = "tool"
restricted = true
fields = [
    { name = "project", type = "string" },
    { name = "run", type = "string", pattern = "^\\d+$" },
    { name = "auditor", type = "string", pattern = "^(holtz|justine)$" },
    { name = "tree_hash", type = "string", pattern = "^[0-9a-f]{64}$" },
    { name = "scope", type = "string", pattern = "^(full|affected)$" },
    { name = "command", type = "string" },
    { name = "test_count", type = "string", pattern = "^\\d+$", optional = true },
    # HEAD when the suite ran. `scope = "affected"` means "the tests covering
    # what changed since a tree where everything passed", and this is what the
    # *next* affected run measures that change from: it diffs against the
    # commit named by the most recent `full` green. Optional because a repo
    # with no commits has no HEAD, and an affected run that cannot find a
    # baseline widens to the full suite rather than guessing one. Reuses
    # `commit_hash` — the same name `finding_resolved` already gives a git oid.
    { name = "commit_hash", type = "string", pattern = "^[0-9a-f]{7,40}$", optional = true },
]

# `hook:`, so H4 holds it to being registered in hooks.json — which it must be,
# since a PostToolUse hook that the harness never fires records nothing and the
# fix loop simply stops. The suite still runs from `verify_suite.py` in the
# agent's shell; that shell is sandboxed and cannot reach the daemon, so the
# courier is what turns a green run into a ledger entry. Both owe the hash pin,
# which is what the daemon actually checks.
[[events.suite_green.producers]]
id = "hook:enforcement/hooks/suite_courier.py"

