    { name = "search_path", type = "string", optional = true },
    { name = "tool", type = "string" },
]

[[events.file_search.producers]]
id = "engine:auto_record:Grep"

[events.bash_command]
description = "Shell command executed by agent (recorded by post-tool hook)"
attestation = "agent"
fields = [
    { name = "command", type = "string" },
]

[[events.bash_command.producers]]
id = "hook:enforcement/hooks/post_tool_hook.py"

[events._checkpoint]
description = "Cross-run project checkpoint — triggers living document renders"
fields = [
    { name = "project", type = "string" },
    { name = "run", type = "string", pattern = "^\\d+$" },
    { name = "auditor", type = "string", pattern = "^(holtz|justine)$" },
    { name = "note", type = "string", optional = true },
]

[events.finding_deferred]
description = "A finding was deferred"
attestation = "agent"
fields = [
    { name = "project", type = "string" },
    { name = "run", type = "string", pattern = "^\\d+$" },
    { name = "auditor", type = "string", pattern = "^(holtz|justine)$" },
    { name = "phase", type = "string", pattern = "^(recon|audit|merge|fix_loop|convergence|finalize)$" },
    { name = "step", type = "string", pattern = "^\\d+$" },
    { name = "id", type = "string", pattern = "^B[HJ]-\\d{3}$" },
    { name = "reason", type = "string", pattern = "^(cant_reproduce|low_priority|medium_budget)$" },
    { name = "evidence_path", type = "string", optional = true },
]

[[events.finding_deferred.producers]]
id = "agent:cli"
