    # `theoretical` is P0.5's third route (D29), written only by
    # `theoretical_courier.py`. It is a reason of its own rather than
    # `low_priority` because nothing about a theoretical finding says it is low
    # priority — only that no path to it has been found — and because
    # `medium_deferral_budget` counts `medium_budget` alone, so a route with its
