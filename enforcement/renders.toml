[[renders]]
target = "STATUS.md"
template = "templates/status.md.tera"
trigger = "on_transition"
ledger_template = "run"

[[renders]]
target = "PUNCHLIST.md"
template = "templates/punchlist.md.tera"
trigger = "on_event"
event_types = ["finding", "finding_resolved", "finding_deferred"]
ledger_template = "run"

[[renders]]
target = "SUMMARY.md"
template = "templates/summary.md.tera"
trigger = "on_state"
state = "converged"
ledger_template = "run"

# The living documents (patterns-brief.md, LIVING-PUNCHLIST.md,
# architecture-baseline.md) are AGENT-owned per the skill instructions and
# deliberately have no render entries. Rendering them tracked the files in
# the manifest, so the skill-prescribed agent writes triggered permanent
# protocol_violation events (#57). The old renders were also inert: they
# pulled content from _checkpoint event fields that nothing ever recorded.
