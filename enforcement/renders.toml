[[renders]]
target = "STATUS.md"
template = "templates/status.md.tera"
trigger = "on_transition"
ledger_template = "run"

# The same target again, on the finding family (D-g). `trigger` is one string
# per entry and the engine loops every entry, so two entries is how a target
# answers to both — it renders on a transition *and* on a finding event.
# Without this, STATUS.md's Open/Resolved counts freeze between transitions,
# and the fix loop runs many findings between them.
[[renders]]
target = "STATUS.md"
template = "templates/status.md.tera"
trigger = "on_event"
event_types = ["finding", "finding_resolved", "finding_deferred"]
ledger_template = "run"

[[renders]]
target = "PUNCHLIST.md"
template = "templates/punchlist.md.tera"
trigger = "on_event"
event_types = ["finding", "finding_resolved", "finding_deferred"]
ledger_template = "run"

[[renders]]
target = "PUNCHLIST-ARCHIVE.md"
template = "templates/punchlist-archive.md.tera"
trigger = "on_event"
event_types = ["finding", "finding_resolved", "finding_deferred"]
ledger_template = "run"

[[renders]]
target = "DEFERRED.md"
template = "templates/deferred.md.tera"
trigger = "on_event"
# `finding` is not here (D-b): it made the file exist from the run's first
# finding, which is what reduced `converge`'s conjunct to a `file_exists` on a
# file the engine wrote unconditionally. `finding_resolved` is, because a
# deferred finding fixed anyway has to leave the list.
event_types = ["finding_deferred", "finding_resolved"]
ledger_template = "run"

[[renders]]
target = "SUMMARY.md"
template = "templates/summary.md.tera"
trigger = "on_state"
state = "converged"
ledger_template = "run"

# The living documents (patterns-brief.md, LIVING-PUNCHLIST.md,
# architecture-baseline.md) are AGENT-owned per the skill instructions and
# deliberately have no render entries. Rendering them tracked the files in
# the manifest, so the skill-prescribed agent writes triggered permanent
# protocol_violation events (#57). The old renders were also inert: they
# pulled content from _checkpoint event fields that nothing ever recorded.
