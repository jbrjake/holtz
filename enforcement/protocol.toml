[protocol]
name = "holtz"
version = "1.0.0"
description = "TDD audit convergence protocol with adversarial self-play"

[paths]
managed = ["docs/holtz", "enforcement/"]
data_dir = "docs/holtz/.sahjhan"
render_dir = "docs/holtz"

[namespaces]
default = "holtz"
allowed = ["holtz", "justine"]

[sets.perspective]
description = "Analytical lens for multi-perspective auditing"
values = [
    "component",
    "integration",
    "security",
    "error-propagation",
    "data-flow",
    "contract",
    "semantic-fidelity",
    "temporal-protocol",
    "public-contract",
    "concurrency",
    "resource-lifecycle",
    "idempotency",
    "observability",
]

[ledgers.run]
description = "Per-run audit ledger"
path_template = "docs/holtz/runs/{template.instance_id}/ledger.jsonl"

[ledgers.project]
description = "Cross-run project ledger"
path = "docs/holtz/project.jsonl"

[aliases]
"run start" = "transition run_start"
"recon complete" = "transition recon_complete"
"audit complete" = "transition audit_complete"
"merge complete" = "transition merge_complete"
"fix commit" = "transition fix_commit"
"lens complete" = "set complete perspective"
"lens status" = "set status perspective"
"lens rotate" = "transition lens_rotate"
"sweep start" = "transition final_sweep_start"
"converge" = "transition converge"
"finalize" = "transition finalize"
"finding" = "event finding"
"resolve" = "event finding_resolved"
"recon finding" = "event recon_finding"
"audit claim" = "event audit_claim"
"test finding" = "event test_audit_finding"
"code finding" = "event code_audit_finding"
"graph delta" = "event graph_delta"
"defer cant-reproduce" = "transition defer_cant_reproduce"
"defer low" = "transition defer_low"
"defer medium" = "transition defer_medium"
"defer batch" = "batch defer"

# ── Named queries (#82) ──
#
# A predicate that decides a fact should exist once. #77 was two copies of one
# fact drifting apart until the blocking condition was strictly stronger than
# the escape it printed, and the agent deadlocked while being told exactly
# which impossible thing to do. A named query makes the two gates the same
# object, so they cannot disagree. `sahjhan lint` L6 reports the copies not yet
# migrated.

[queries.all_findings_closed]
sql = "SELECT count(*) FROM events f WHERE f.type='finding' AND f.id NOT IN (SELECT r.id FROM events r WHERE r.type='finding_resolved') AND f.id NOT IN (SELECT d.id FROM events d WHERE d.type='finding_deferred')"
intent = "all findings must be resolved or deferred"

[queries.item_open]
sql = "SELECT count(*) = 0 FROM events WHERE type IN ('finding_resolved', 'finding_deferred') AND id='{{item_id}}'"
intent = "finding must not already be resolved or deferred"

# A finding's severity is its *latest* filing. The ledger holds every filing,
# `punchlist.md.tera` and `findings.py` both render the last one, and the
# deferral gates used to match any row ever filed under the id — so a finding
# corrected LOW -> HIGH still satisfied `defer_low`, and a run could close a
# HIGH by deferring the severity it no longer has. Same shape as P3.6's
# duplicate-id count, one field further in: the correction is supposed to
# supersede what it corrects.
#
# `f.id` is pinned by the argument, so the seq of the last filing is a plain
# scalar subquery here; the run-wide counts below need the correlated form.

[queries.item_is_low]
sql = "SELECT count(*) >= 1 FROM events WHERE type='finding' AND id='{{item_id}}' AND severity='LOW' AND seq = (SELECT MAX(g.seq) FROM events g WHERE g.type='finding' AND g.id='{{item_id}}')"
intent = "finding must exist and its latest filing must be LOW"

[queries.item_is_medium]
sql = "SELECT count(*) >= 1 FROM events WHERE type='finding' AND id='{{item_id}}' AND severity='MEDIUM' AND seq = (SELECT MAX(g.seq) FROM events g WHERE g.type='finding' AND g.id='{{item_id}}')"
intent = "finding must exist and its latest filing must be MEDIUM"

# count(DISTINCT id), not count(*): this is a policy on findings, and the
# ledger holds rows. A MEDIUM re-filed under its own id is a correction, not a
# second finding — counting rows inflated the denominator and let a deferral
# past the cap that exists to stop it. The numerator has the same shape from
# the other side: `event finding_deferred` is on the bootstrap allowlist, so a
# deferral recorded twice would spend budget once too often. And a finding
# corrected MEDIUM -> HIGH is not a MEDIUM at all, so it funds no budget.
# The two batch populations. `item_is_low` answers "is *this* id LOW" with the
# id pinned by the argument; these answer "which ids are LOW" run-wide, so the
# max-seq subquery has to correlate on `f.id` the way
# `medium_deferral_budget`'s denominator does. Severity is the latest filing
# (D25): a finding corrected LOW -> HIGH must not be swept into a LOW batch,
# which is the same defect `fe2ef56` fixed one field in.
#
# Openness is spelled as the two NOT INs rather than by calling `item_open`,
# because a named query cannot reference another one — `all_findings_closed`
# carries the identical pair for the same reason.
#
# The batch re-runs these per step, after earlier steps have appended, so the
# MEDIUM population is read with the LOW deferrals already on the ledger.

[queries.open_low_findings]
sql = "SELECT f.id FROM events f WHERE f.type='finding' AND f.severity='LOW' AND f.seq = (SELECT MAX(g.seq) FROM events g WHERE g.type='finding' AND g.id = f.id) AND f.id NOT IN (SELECT r.id FROM events r WHERE r.type='finding_resolved') AND f.id NOT IN (SELECT d.id FROM events d WHERE d.type='finding_deferred')"
intent = "open findings whose latest filing is LOW"

[queries.open_medium_findings]
sql = "SELECT f.id FROM events f WHERE f.type='finding' AND f.severity='MEDIUM' AND f.seq = (SELECT MAX(g.seq) FROM events g WHERE g.type='finding' AND g.id = f.id) AND f.id NOT IN (SELECT r.id FROM events r WHERE r.type='finding_resolved') AND f.id NOT IN (SELECT d.id FROM events d WHERE d.type='finding_deferred')"
intent = "open findings whose latest filing is MEDIUM"

# The escape's first conjunct. `open_low_findings` returns the ids the batch
# transitions; a gate needs a scalar, and named queries cannot reference one
# another. `test_amplification_breaker.py` runs both and asserts the count
# equals the number of ids, so editing one without the other fails.
[queries.open_low_count]
sql = "SELECT count(*) FROM (SELECT f.id FROM events f WHERE f.type='finding' AND f.severity='LOW' AND f.seq = (SELECT MAX(g.seq) FROM events g WHERE g.type='finding' AND g.id = f.id) AND f.id NOT IN (SELECT r.id FROM events r WHERE r.type='finding_resolved') AND f.id NOT IN (SELECT d.id FROM events d WHERE d.type='finding_deferred'))"
intent = "no open LOW findings remain"

# P0.1's amplification circuit-breaker: A = findings filed since fix_loop_start
# / findings resolved since fix_loop_start, evaluated at each round, true when
# A > 1.0 for the last three rounds. The audited run filed 2.43 findings per
# fix and its open count rose 124 -> 273, falling exactly once; it was
# non-terminating from pattern round 1 and nothing measured that.
#
# `A > 1.0` is written as `filed > resolved` rather than as a division: it is
# exact wherever A is defined, and it gives the right answer where A is not —
# resolved=0 with findings filed is infinite amplification (true), and a round
# with no activity either way is not amplification (false).
#
# The window is a seq floor — the seq of the *third*-most-recent round — not
# `ORDER BY seq DESC LIMIT 3`. Dropping the floor entirely answers "any three
# diverging rounds ever", which on a run that diverged twice, recovered, and
# relapsed once reads `true` where the clause says `false`. Three *consecutive*
# rounds is the condition; three rounds is not.
#
# Correlated scalar subqueries are rejected by the query planner in this
# position ("Physical plan does not support logical expression
# ScalarSubquery"), so the per-round counts come from a self-join with
# GROUP BY/HAVING. A round that joins no events at all drops out, which is the
# wanted answer: filed=0 and resolved=0 is not divergence.
#
# `fix_loop_start` is the run's *first* `state_transition` into fix_loop —
# MIN(seq), not MAX — so the measurement spans the whole loop rather than
# resetting at every lens rotation back into it.
[queries.amplification_diverging]
sql = "SELECT count(*) >= 3 FROM (SELECT r.seq FROM events r JOIN events f ON f.seq <= r.seq AND f.seq > COALESCE((SELECT MIN(s.seq) FROM events s WHERE s.type='state_transition' AND s.to='fix_loop'), 0) WHERE r.type='pattern_analysis_complete' AND r.seq >= COALESCE((SELECT MAX(a.seq) FROM events a WHERE a.type='pattern_analysis_complete' AND a.seq < (SELECT MAX(b.seq) FROM events b WHERE b.type='pattern_analysis_complete' AND b.seq < (SELECT MAX(c.seq) FROM events c WHERE c.type='pattern_analysis_complete'))), 0) GROUP BY r.seq HAVING count(DISTINCT CASE WHEN f.type='finding' THEN f.id END) > count(DISTINCT CASE WHEN f.type='finding_resolved' THEN f.id END))"
intent = "more findings filed than resolved since fix_loop_start, for three consecutive rounds"

[queries.medium_deferral_budget]
sql = "SELECT (SELECT count(DISTINCT id) FROM events WHERE type='finding_deferred' AND reason='medium_budget') < (SELECT count(DISTINCT f.id) FROM events f WHERE f.type='finding' AND f.severity='MEDIUM' AND f.seq = (SELECT MAX(g.seq) FROM events g WHERE g.type='finding' AND g.id = f.id)) / 2"
intent = "MEDIUM deferrals must not exceed 50% of total MEDIUM findings"

# The predicate #77 deadlocked on, now a single object with three consumers:
# the `pattern_check` gate (ready when true), the `iteration_boundary` gate
# (blocked when true), and `protocol_tracker.py`, which resolves this name at
# runtime so the commit gate's hard block reads the same fact. Three copies of
# it existed before — one per consumer — and the moment two disagreed, the
# commit gate blocked a real fix and told the agent to run `pattern_check`,
# which was itself blocked. Block condition and printed escape are now the same
# expression by construction; `enforcement_lint.py` H7/H8 fail the build if a
# fourth copy appears or a consumer stops referencing this name.
#
# The second conjunct is the yield stop (P0.2). A round costs a 17.9-min
# median and 43% of in-loop time, and on the run this protocol was measured
# against, rounds 12 through 15 added no new pattern between them for 268
# agent-min. Two consecutive rounds that wrote nothing into the brief means the
# obligation stops; it does not mean rounds stop. The fix loop's usual path
# runs a round without entering `pattern_analysis` at all, so a run that wants
# another one still has it — what is withdrawn is the *demand*, at
# `iteration_boundary` and `set complete perspective`.
#
# Gating this on `patterns_found` is only honest because that field is now
# derived: the courier reads the `## PAT-NNN:` headings out of the brief, so
# reporting a dry round costs actually writing nothing. Typed by the agent, as
# it was until P5.4, this conjunct would have been a gate the agent could open
# by understating — and understating is the direction laziness points.
#
# A NULL `patterns_found` (a ledger written before P5.4) is not counted as a
# zero, so an old ledger keeps the obligation rather than silently losing it.
#
# The "last two rounds" window is a seq floor — the seq of the second-most-
# recent round — and not `ORDER BY seq DESC LIMIT 2` in a derived table. The
# engine applies an outer WHERE *before* that LIMIT, so the LIMITed form counts
# every zero-yield round the run ever had and stops the obligation the moment
# any two rounds anywhere were dry. It answers a plausible question and the
# wrong one; the difference is invisible until a run has three rounds.
# The third conjunct is the backpressure stop (P0.2, D6). A round's job is to
# find siblings, so running one while the siblings from earlier rounds are
# still open buys more board rather than less. Past 25 open, the obligation
# lapses — the same way it lapses after two dry rounds — and the run is
# expected to fix what it already filed.
#
# The population is the findings a round attributed to a pattern, and it is
# joined to the rounds rather than trusted on its own: a `pattern_id` counts
# only when that PAT appears in some round's `pattern_ids`, which the courier
# derives from the brief's `## PAT-NNN:` headings and the agent cannot type.
# So the population cannot be inflated past what the brief actually contains.
# It can still be *under*-reported by leaving the field off, which is the
# direction that forfeits the relief this conjunct grants, not the direction
# that dodges a block.
#
# The membership test is `strpos` over a comma-fenced list rather than LIKE:
# `pattern_ids` is a joined string, and fencing both sides with commas is what
# stops PAT-1 matching PAT-10. A NULL on either side yields NULL and drops out,
# which is right for a dry round and for an unattributed finding.
[queries.pattern_analysis_overdue]
sql = "SELECT (SELECT count(*) FROM events WHERE type='finding_resolved' AND seq > COALESCE((SELECT MAX(seq) FROM events WHERE type='pattern_analysis_complete'), 0)) >= 3 AND (SELECT count(*) FROM events e WHERE e.type='pattern_analysis_complete' AND CAST(e.patterns_found AS INTEGER) = 0 AND e.seq >= COALESCE((SELECT MAX(p.seq) FROM events p WHERE p.type='pattern_analysis_complete' AND p.seq < (SELECT MAX(q.seq) FROM events q WHERE q.type='pattern_analysis_complete')), 0)) < 2 AND (SELECT count(*) FROM (SELECT DISTINCT f.id FROM events f JOIN events p2 ON p2.type='pattern_analysis_complete' AND strpos(','||p2.pattern_ids||',', ','||f.pattern_id||',') > 0 WHERE f.type='finding' AND f.id NOT IN (SELECT r.id FROM events r WHERE r.type='finding_resolved') AND f.id NOT IN (SELECT d.id FROM events d WHERE d.type='finding_deferred'))) <= 25"
intent = "3+ findings resolved since the last pattern analysis, unless the last two rounds added no pattern or more than 25 pattern-filed findings are open"

[queries.quiz_exhaustions_resolved]
sql = "SELECT count(*) = 0 FROM events e WHERE e.type='quiz_exhausted' AND e.perspective NOT IN (SELECT r.perspective FROM events r WHERE r.type='quiz_exhausted_resolved')"
intent = "no unresolved quiz exhaustions"

# ── Batches ──
#
# The circuit-breaker's escape, in one command. The engine knows nothing about
# severity or findings: `param` names the flag, each step's `value` selects it,
# `items` is a query returning an `id` column, and `transition` is applied to
# each id *with that transition's own gates*. So `defer_medium`'s 50% budget
# still holds inside the batch — the MEDIUM step refuses the moment the cap is
# reached, per item, and refusals are reported rather than fatal.
#
# That is why the breaker's predicate has to be phrased as the budget being
# *spent*, not the MEDIUM set being empty: one run of this command always
# reaches the cap, and can never clear the whole set.

[batches.defer]
description = "Defer open findings in bulk, by severity"
param = "severity"
steps = [
    { value = "low", items = "open_low_findings", transition = "defer_low" },
    { value = "medium", items = "open_medium_findings", transition = "defer_medium" },
]

# ── Boundaries (#82) ──
#
# The /clear between building the punchlist and the first fix is the whole
# point of `awaiting_clear`. Declaring it as a boundary turns "no second
# `resume` quietly became a way around it" from a hand-written test into a
# property: lint L3 deletes every edge tagged `context-reset` and proves
# fix_loop is then unreachable from merge_done. `awaiting_human` also exposes a
# `resume` command, and that is exactly the shape this check exists to watch.

[[boundaries]]
name = "context-reset"
must_traverse = { from = "merge_done", to = "fix_loop" }

# ── Attestation (#82) ──
#
# Evidence has strength, and the vocabulary #79 was missing. The engine never
# learns what these mean; it only compares positions (lint L7).
#
#   agent   — a command the agent runs. Forgeable at will. Fine for
#             bookkeeping, wrong for a gate meant to constrain the agent.
#   tool    — a Pre/PostToolUse hook observing a real tool call. The agent can
#             cause it, but only by doing the thing.
#   ambient — a signal that fires without anyone intending it. This is the
#             class that had no name, which is why #79's UserPromptSubmit
#             provenance read as host-attested to every reader.
#   host    — a session-lifecycle act no tool call can produce.
#   human   — a person typed the command themselves. The only class that
#             entails a *decision*, as opposed to an occurrence: `host` proves
#             a context was wiped, but nothing about `host` proves anyone
#             agreed to anything. Reached by denying the agent's tool-call
#             path in the bootstrap hook and telling the user to run
#             `! sahjhan …`, which the harness executes directly (#81).
#
# `scripts/enforcement_lint.py` H5 falsifies these against reality: an event
# claiming anything above `agent` must be unwritable by the agent — either
# `restricted = true` (trusted hooks only) or denied in the bootstrap hook's
# allowlist. Otherwise `sahjhan event` writes it anyway and the declaration is
# decoration.

[attestation]
levels = ["agent", "tool", "ambient", "host", "human"]

# ── Daemon ──

[daemon]
# Arm sahjhan's sandbox fuse. The daemon refuses every privileged operation —
# signing, the quiz vault, enforcement state, restricted events — unless this
# project's Claude Code settings confirm the agent's shell is confined and the
# daemon socket is unreachable from inside it.
#
# It is armed because the alternative was never true. `vault.toml` used to
# describe its state-gating as defence in depth "on top of the trusted-caller
# auth that already blocks the agent" — and that auth does not block the agent
# and provably cannot: a same-user process can fork a connected socket into an
# exec of a genuine hook, or load code into one. Peer identity is hardening.
# The OS sandbox is the boundary, and this is what makes the daemon refuse to
# serve without it rather than assume it.
#
# `holtz-start` raises the boundary; `enforcement/hooks/sandbox_control.py`
# writes the settings the fuse reads. protocol.toml is sealed into the genesis
# ledger, so a checkout cannot quietly disarm this.
#
# Known limit, stated rather than buried: the fuse reads configuration, not
# kernel state. Requiring `failIfUnavailable` is what closes that gap on
# macOS. On Linux the socket block additionally needs the optional
# @anthropic-ai/sandbox-runtime seccomp filter, which nothing here can verify.
require_sandbox = true

# ── Lint (#82) ──

[lint]
# Not yet enabled: `require_producers` holds every event to full closure, but
# holtz's producers are Python hooks and skill-file commands the engine cannot
# see, so the declarations below are the input that makes it meaningful.
# scripts/enforcement_lint.py H1 already enforces closure against the tree.
require_producers = false

