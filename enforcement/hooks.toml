# Runtime enforcement hooks for the holtz audit protocol.
# Evaluated by `sahjhan hook eval` on every tool use.
# Sealed at init time alongside the other 5 config files.

# ── TDD Gate ──
# Block source file edits in fix_loop without a prior failing test *by the
# agent doing the editing*. Makes TDD mechanically unavoidable. Filter excludes
# test files.
#
# The predicate: an actor holds authorisation while it has a `tdd_evidence` row
# whose finding has no later `finding_resolved`. Both halves are scoped, and
# they are scoped to different things:
#
#   filter        what counts   — the caller. `{{agent_id}}` binds to the actor
#                                 `pre_tool_hook.py` passes to `hook eval`; the
#                                 orchestrator is the empty string, a real
#                                 actor and never a wildcard.
#   since_filter  where the     — that same evidence row's own finding.
#                 window starts   `{{event.finding_id}}` reads the candidate,
#                                 so the window is computed per evidence row.
#
# `fix_commit BH-NNN` auto-emits `finding_resolved` for that id, so an actor's
# evidence is consumed by its own commit and by nothing else: a sibling's
# commit names its own id and leaves this actor's row standing. A run-global
# window ("any evidence this run") would satisfy the letter of "scope it to the
# actor" while turning a per-fix gate into a per-actor-per-run one.
#
# `tdd_evidence` is `restricted` and written by `tdd_courier.py` from the hook
# payload, never from anything the agent typed. The courier pairs it per
# finding, which is what makes `finding_id` a correlatable key.
#
# Needs sahjhan >= 0.24.0 for `since_filter` (jbrjake/sahjhan#35). Both field
# names it references are checked against events.toml when the config is
# sealed, so a window that would silently widen to the whole run is unsealable
# rather than merely wrong (#34).
#
# ⚠️ The generated contract reports this gate as forgeable, and it is right to:
# `finding_resolved` is agent-writable by design (the documented
# `sahjhan resolve` reconciliation path). **Read the direction before reading
# the flag.** An agent-written `finding_resolved` can only ever move an
# evidence row *out* of the window — it denies the forger, it cannot admit
# them, and `tdd_evidence` itself is restricted. There is no spelling of an
# agent-written event that opens this gate; that is `tdd_courier.py`'s alone.
#
# The one thing it does buy an agent is the ability to revoke a *sibling's*
# authorisation by resolving the sibling's finding out of band. That is
# strictly narrower than a run-global window, under which any transition
# revoked every actor at once.

[[hooks]]
event = "PreToolUse"
tools = ["Edit", "Write", "NotebookEdit"]
states = ["fix_loop"]
action = "block"
message = "TDD violation: write and run a failing test before editing source files. Record with: sahjhan --config-dir \"$CLAUDE_PLUGIN_ROOT/enforcement\" event test_failed_before_fix --field project=holtz --field run=N --field auditor=holtz --field finding_id=BH-NNN --field test_name=..."

[hooks.gate]
type = "ledger_has_event_since"
event = "tdd_evidence"
since = "last_event_of_type:finding_resolved"
since_filter = { id = "{{event.finding_id}}" }
filter = { agent_id = "{{agent_id}}" }

[hooks.filter]
path_not_matches = "tests/**"

# ── Premature Completion Blocker ──
# Block stop when agent output claims completion in non-terminal states.

[[hooks]]
event = "Stop"
states_not = ["converged", "finalized"]
action = "block"
message = "You are claiming completion but sahjhan state is {current_state}, not converged/finalized. Run `sahjhan --config-dir \"$CLAUDE_PLUGIN_ROOT/enforcement\" status` to check your position. Continue the protocol."

[hooks.check]
type = "output_contains_any"
patterns = [
    "audit complete",
    "audit is complete",
    "all fixes applied",
    "CONVERGED",
    "holtz complete",
    "holtz audit complete",
    "all issues resolved",
    "punchlist complete",
    "work is done",
    "summary of everything",
    "convergence achieved",
    "no remaining items",
    "all findings resolved",
]

# ── Edit Accumulation Warning ──
# Warn after many *source edits* in fix_loop without a state transition.
# Catches "batch all fixes then summarize" anti-pattern. Counts only
# source_edit events (not reads/searches) so the signal reflects uncommitted
# work rather than investigation noise (#70 item 7; needs sahjhan >= 0.17.0).

[[hooks]]
event = "PostToolUse"
tools = ["Edit"]
states = ["fix_loop"]
action = "warn"
message = "High activity: {count} source edits since your last fix_commit. Each fix must be committed atomically. Run: sahjhan --config-dir \"$CLAUDE_PLUGIN_ROOT/enforcement\" transition fix_commit -- BH-NNN"

[hooks.check]
type = "event_count_since_last_transition"
threshold = 8
event_types = ["source_edit"]

# ── Auto-Record: File Reads ──

[[hooks]]
event = "PostToolUse"
tools = ["Read"]

[hooks.auto_record]
event_type = "file_read"
fields = { file_path = "{tool.file_path}" }

# ── Auto-Record: Source Edits ──

[[hooks]]
event = "PostToolUse"
tools = ["Edit", "Write", "NotebookEdit"]

[hooks.auto_record]
event_type = "source_edit"
fields = { file_path = "{tool.file_path}" }

# ── Auto-Record: File Searches ──

[[hooks]]
event = "PostToolUse"
tools = ["Grep"]

[hooks.auto_record]
event_type = "file_search"
fields = { file_path = "{tool.file_path}" }

# ── Monitors ──

[[monitors]]
name = "fix_loop_stall"
states = ["fix_loop"]
action = "warn"
# Counts only source edits (not reads/searches) so it flags genuinely
# uncommitted work instead of climbing to 30-40 on investigation noise
# (#70 item 7; needs sahjhan >= 0.17.0).
message = "{count} source edits since last state transition. Run `sahjhan --config-dir \"$CLAUDE_PLUGIN_ROOT/enforcement\" status`. If you have been fixing bugs without committing, stop and commit each fix atomically."

[monitors.trigger]
type = "event_count_since_last_transition"
threshold = 12
event_types = ["source_edit"]

[[monitors]]
name = "audit_stall"
states = ["audit"]
action = "warn"
message = "{count} events in audit state without advancing. Run `sahjhan --config-dir \"$CLAUDE_PLUGIN_ROOT/enforcement\" status` to check progress."

[monitors.trigger]
type = "event_count_since_last_transition"
threshold = 30
