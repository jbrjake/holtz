# Runtime enforcement hooks for the holtz audit protocol.
# Evaluated by `sahjhan hook eval` on every tool use.
# Sealed at init time alongside the other 5 config files.

# ── TDD Gate ──
# Block source file edits in fix_loop without a prior failing test *by the
# agent doing the editing*. Makes TDD mechanically unavoidable. Filter excludes
# test files. Every fix_commit self-loop is a state transition, so the gate
# resets.
#
# Scoped to the caller, not the run (P0.3, D32/D33). The gate used to read
# `test_failed_before_fix` — an agent-written event naming no actor — so it
# could only ask whether *anyone* had recorded a failing test since the last
# transition. With two fix agents working, each one's source edit was
# authorised by the other's failing test, which is why the fix loop had to run
# one-at-a-time and spent 89% of subagent wall-clock at concurrency 1.
#
# `tdd_evidence` is the same fact with the actor attached, written by
# `tdd_courier.py` from the hook payload rather than from anything the agent
# typed. `{{agent_id}}` binds to the caller `pre_tool_hook.py` passes through
# to `hook eval`; the orchestrator is the empty string, a real actor and never
# a wildcard. Needs sahjhan >= 0.23.0, which resolves templates in gate
# filters — before that a filter value was compared literally.
#
# D33 scoped the *filter* to the actor and left the *window* run-global, which
# is item 1: `since = "last_transition"` reads the whole ledger's last
# transition, and the orchestrator records a `fix_commit` every time any
# subagent lands. So every other in-flight subagent lost its own authorisation
# the moment a sibling committed, and its escape — re-record a failing test —
# was unreachable once its fix was already written. Driven: agent-B records ->
# allow; an unrelated `fix_commit` lands -> the same edit returns deny.
#
# `ledger_has_event_since` cannot express an actor-scoped window. Driven
# against 0.23.0: `since` understands `last_transition` and nothing else, and
# an unrecognised anchor does not error — it silently *falls back* to
# `last_transition`, which is #65's hazard, still live. So the window is
# expressed as SQL here rather than as an anchor the engine would quietly
# reinterpret.
#
# The window closes on this actor's own fix, not on anyone's transition: the
# actor holds authorisation while it has a `tdd_evidence` row whose finding has
# no later `finding_resolved`. `fix_commit BH-NNN` auto-emits
# `finding_resolved` for that id, so an actor's evidence is consumed by its own
# commit and by nothing else. A sibling's commit emits its own id and leaves
# this actor's row standing. Dropping the consumption term instead — "any
# evidence this run" — would satisfy the letter of "scope it to the actor"
# while turning a per-fix gate into a per-actor-per-run one.
#
# The correlation is on `finding_id`, which `tdd_courier.py` now pairs
# per-finding (item 19). Before that fix the courier stamped whichever
# unpaired row was newest on the whole ledger, so this term would have keyed on
# the wrong finding — the two land together for that reason.
#
# ⚠️ The generated contract now reports this gate as forgeable, and it is right
# to: `finding_resolved` is agent-writable by design (the documented
# `sahjhan resolve` reconciliation path). **Read the direction before reading
# the flag.** The gate is `count(*) > 0` over evidence rows *not yet resolved*,
# and `tdd_evidence` itself is `restricted`. So forging `finding_resolved` can
# only ever *remove* rows from that count — it denies the forger, it cannot
# admit them. There is no spelling of an agent-written event that opens this
# gate; that is still `tdd_courier.py`'s alone.
#
# The one thing it does buy an agent is the ability to revoke a *sibling's*
# authorisation by resolving the sibling's finding out of band. That is
# strictly narrower than what shipped: under `since = "last_transition"` any
# transition revoked *every* actor at once, which is item 1.

[[hooks]]
event = "PreToolUse"
tools = ["Edit", "Write"]
states = ["fix_loop"]
action = "block"
message = "TDD violation: write and run a failing test before editing source files. Record with: sahjhan --config-dir \"$CLAUDE_PLUGIN_ROOT/enforcement\" event test_failed_before_fix --field project=holtz --field run=N --field auditor=holtz --field finding_id=BH-NNN --field test_name=..."

[hooks.gate]
type = "query"
sql = "SELECT count(*) > 0 FROM events e WHERE e.type='tdd_evidence' AND e.agent_id='{{agent_id}}' AND NOT EXISTS (SELECT 1 FROM events r WHERE r.type='finding_resolved' AND r.id = e.finding_id AND r.seq > e.seq)"
expect = "true"

[hooks.filter]
path_not_matches = "tests/**"

# ── Premature Completion Blocker ──
# Block stop when agent output claims completion in non-terminal states.

[[hooks]]
event = "Stop"
states_not = ["converged", "finalized"]
action = "block"
message = "You are claiming completion but sahjhan state is {current_state}, not converged/finalized. Run `sahjhan --config-dir \"$CLAUDE_PLUGIN_ROOT/enforcement\" status` to check your position. Continue the protocol."

[hooks.check]
type = "output_contains_any"
patterns = [
    "audit complete",
    "audit is complete",
    "all fixes applied",
    "CONVERGED",
    "holtz complete",
    "holtz audit complete",
    "all issues resolved",
    "punchlist complete",
    "work is done",
    "summary of everything",
    "convergence achieved",
    "no remaining items",
    "all findings resolved",
]

# ── Edit Accumulation Warning ──
# Warn after many *source edits* in fix_loop without a state transition.
# Catches "batch all fixes then summarize" anti-pattern. Counts only
# source_edit events (not reads/searches) so the signal reflects uncommitted
# work rather than investigation noise (#70 item 7; needs sahjhan >= 0.17.0).

[[hooks]]
event = "PostToolUse"
tools = ["Edit"]
states = ["fix_loop"]
action = "warn"
message = "High activity: {count} source edits since your last fix_commit. Each fix must be committed atomically. Run: sahjhan --config-dir \"$CLAUDE_PLUGIN_ROOT/enforcement\" transition fix_commit -- BH-NNN"

[hooks.check]
type = "event_count_since_last_transition"
threshold = 8
event_types = ["source_edit"]

# ── Auto-Record: File Reads ──

[[hooks]]
event = "PostToolUse"
tools = ["Read"]

[hooks.auto_record]
event_type = "file_read"
fields = { file_path = "{tool.file_path}" }

# ── Auto-Record: Source Edits ──

[[hooks]]
event = "PostToolUse"
tools = ["Edit", "Write", "NotebookEdit"]

[hooks.auto_record]
event_type = "source_edit"
fields = { file_path = "{tool.file_path}" }

# ── Auto-Record: File Searches ──

[[hooks]]
event = "PostToolUse"
tools = ["Grep"]

[hooks.auto_record]
event_type = "file_search"
fields = { file_path = "{tool.file_path}" }

# ── Monitors ──

[[monitors]]
name = "fix_loop_stall"
states = ["fix_loop"]
action = "warn"
# Counts only source edits (not reads/searches) so it flags genuinely
# uncommitted work instead of climbing to 30-40 on investigation noise
# (#70 item 7; needs sahjhan >= 0.17.0).
message = "{count} source edits since last state transition. Run `sahjhan --config-dir \"$CLAUDE_PLUGIN_ROOT/enforcement\" status`. If you have been fixing bugs without committing, stop and commit each fix atomically."

[monitors.trigger]
type = "event_count_since_last_transition"
threshold = 12
event_types = ["source_edit"]

[[monitors]]
name = "audit_stall"
states = ["audit"]
action = "warn"
message = "{count} events in audit state without advancing. Run `sahjhan --config-dir \"$CLAUDE_PLUGIN_ROOT/enforcement\" status` to check progress."

[monitors.trigger]
type = "event_count_since_last_transition"
threshold = 30
