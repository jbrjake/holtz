name: Bug Report
description: Something isn't working correctly.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please fill out the sections below so we can
        reproduce and fix the issue.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: |
        Holtz flagged a false positive on...
        The convergence loop didn't terminate because...
        The impact graph edge between X and Y is incorrect because...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal steps to trigger the bug.
      placeholder: |
        1. Run `holtz audit` on a project with...
        2. Observe that...
        3. Expected behavior was...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Holtz version
      description: Version from `.claude-plugin/plugin.json`
      placeholder: "0.4.0"
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Claude Code version, OS, Python version, any relevant context.
      placeholder: |
        Claude Code: 1.x.x
        OS: macOS 15.x / Ubuntu 24.04 / Windows 11
        Python: 3.12

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Paste any relevant audit output, error messages, or punchlist entries.
      render: shell

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues for duplicates.
          required: true
        - label: This is not a security vulnerability. (Use [private reporting](https://github.com/jbrjake/holtz/security/advisories/new) for security issues.)
          required: true
