name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install pytest pytest-cov ruff mypy hypothesis
      - name: Download sahjhan binary
        run: |
          source .venv/bin/activate
          python -c "
          import sys; sys.path.insert(0, 'enforcement/hooks')
          from _resolve import ensure_sahjhan
          path = ensure_sahjhan()
          print(f'Binary at: {path}' if path else 'Download failed (integration tests will skip)')
          "
      - name: Lint
        run: |
          source .venv/bin/activate
          ruff check .
      - name: Type check
        run: |
          source .venv/bin/activate
          mypy --explicit-package-bases skills/holtz/scripts/ hooks/ enforcement/hooks/ scripts/ enforcement/scripts/
      - name: Test
        run: |
          source .venv/bin/activate
          python -m pytest --cov=skills/holtz/scripts --cov=hooks --cov=enforcement/hooks --cov-report=term-missing --cov-fail-under=80 --tb=short -q
      - name: Enforcement lint
        run: |
          source .venv/bin/activate
          bash scripts/lint-enforcement.sh
      - name: Contract gate
        run: |
          source .venv/bin/activate
          python scripts/contract_gate.py
      - name: Contract test sync check
        if: github.event_name == 'pull_request'
        run: bash scripts/check_contract_test_sync.sh
