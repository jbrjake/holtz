[tool.ruff]
target-version = "py312"
line-length = 120
src = ["skills/holtz/scripts", "tests", "hooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "E402", "ANN"]
"tests/runner_fixtures.py" = ["E101", "W191"]

[tool.mypy]
python_version = "3.12"
files = ["skills/holtz/scripts", "hooks"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=skills/holtz/scripts --cov=hooks --cov-report=term-missing --cov-fail-under=60"
markers = [
    "machine_specific: tests that depend on local file paths and are skipped on other machines",
]
